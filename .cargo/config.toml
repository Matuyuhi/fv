[alias]
# 静的プレビュー (preview/mod.rs) は製品ビルドに含めない dev 専用 feature なので、
# 毎回 --features を書かずに済むよう別名を用意する:
#   cargo preview            # シーン一覧
#   cargo preview git log    # 複数シーンを縦に並べる
preview = "run --quiet --features preview -- --preview"

# キー入力 → 再描画のコストを測る (preview と同じ dev 専用 feature)。最適化を切ると
# 数字の意味が無くなるので必ず --release で走らせる:
#   cargo perf               # TSV を stdout へ
perf = "run --release --quiet --features preview -- --perf"
