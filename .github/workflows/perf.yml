name: perf

# 毎 PR で回すには重いが、性能劣化の見逃しを防ぐため PR 更新ごとに計測する。
# 手で確かめたいときは Actions タブから workflow_dispatch でも回せる
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ci.yml と同じ理由 (scripts/ci-cargo-cache.sh)。release ビルドは元々 incremental 無し
  CARGO_INCREMENTAL: 0

jobs:
  bench:
    name: perf (ubuntu-24.04)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Action は供給網を増やさないよう公式の checkout / cache のみ。
      # 改竄対策で commit SHA 固定（コメントにバージョン）。Rust はランナー同梱の rustup。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      # ci.yml と同じ鍵の部品 (scripts/ci-cargo-cache.sh)。release ビルドの成果物も同じ
      # target/ に入るので、base 側の測定でも依存のビルドを作り直さずに済む
      - name: Compute cargo cache key
        id: cargo_key
        run: scripts/ci-cargo-cache.sh key >> "$GITHUB_OUTPUT"

      - name: Cache cargo & target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-perf-${{ steps.cargo_key.outputs.rustc }}-${{ steps.cargo_key.outputs.deps }}

      # base と head を同じ runner で連続して測り、比を PR コメントに出す。
      # 遅くなっていても PR は落とさない (閾値超えは ::warning::) — ci.yml の
      # UI スナップショット差分と同じ方針
      - name: Measure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci-perf.sh

      # actions/cache の保存はジョブの post で走るので、その直前に target/ から「コミットごとに
      # 作り直すもの」(fv 自身の成果物・incremental) を落とす。同じ鍵のキャッシュが
      # コミットのたびに太るのを止め、大きさを依存の総量で頭打ちにする (scripts/ci-cargo-cache.sh)
      - name: Prune target before cache save
        run: scripts/ci-cargo-cache.sh prune
