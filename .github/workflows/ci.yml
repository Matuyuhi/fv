name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # contents: write は main への push でスナップショットを追従コミットするためだけに使う
    # (PR の実行では push しない)。fork からの PR では GITHUB_TOKEN が
    # 権限指定に関わらず読み取り専用になるので、コメントも push も静かに諦める
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      # Action は供給網を増やさないよう公式の checkout / cache のみ。
      # 改竄対策で commit SHA 固定（コメントにバージョン）。Rust はランナー同梱の rustup。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      # Cargo.lock には fv 自身の version 行が含まれ、release（bump）のたびに変わる。
      # それを除いてハッシュし「依存が実際に変わった時だけ」キーが変わるようにする
      # （依存の version 変更は checksum 行に必ず出るので取りこぼさない）。これをしないと
      # bump ごとに別キーで巨大キャッシュが新規保存され、リポジトリのキャッシュ上限を食い潰す。
      - name: Compute version-independent cargo cache key
        id: cargo_key
        shell: bash
        run: |
          key=$(grep -v '^version = "' Cargo.lock | shasum -a 256 | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache cargo & target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ steps.cargo_key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      # preview は dev 専用 feature（既定 off）なので、上の clippy では 1 行も型検査されない。
      # 放置すると気づかないうちにコンパイルできなくなるため、有効化した側も必ず見る。
      - name: Clippy (preview feature)
        run: cargo clippy --all-targets --features preview -- -D warnings

      - name: Build
        run: cargo build --verbose

      # feature を付けて回す。今あるユニットテスト (スナップショットの正規化) が
      # preview 側にあり、既定ビルドでは 1 件も実行されないため
      - name: Test
        run: cargo test --verbose --features preview

      # UI のスナップショット差分。プレビュー (preview/) の全シーンを描き直して、
      # コミット済みのテキストと突き合わせる。
      #
      # **差分があっても PR は落とさない**。差分そのものは次のステップが PR コメントとして
      # 出すので、赤い × は「見せる」目的には何も足していない。作者に更新コミットを強いる
      # だけになる。コミット済みテキストとのズレは main への push 時に自動追従で解消する
      # (PR で更新し忘れても、マージ後の main は必ず現在の描画と一致する)。
      #
      # 代償として、描画が非決定になった場合に「毎回 main へ追従コミットが積まれる」形で
      # しか気づけなくなる (落ちていた頃は PR で即座に分かった)。正規化のユニットテストと
      # 履歴に残る chore コミットの目立ちで足りるという判断
      - name: UI snapshots
        env:
          # README に載せる画面。テキストのスナップショットと同じ 1 フレームから焼くので、
          # 「実装は変わったのにスクリーンショットだけ古い」が起きない。
          # 画像は git の履歴に残り続けるため、載せる先があるシーンだけを挙げる
          IMAGE_SCENES: view
        run: |
          cargo run --quiet --features preview -- --preview --update-snapshots
          for scene in $IMAGE_SCENES; do
            cargo run --quiet --features preview -- --preview "$scene" --svg
          done
          # 新規シーンのファイルは未追跡のままだと git diff に出ないので intent-to-add しておく
          git add --intent-to-add tests/snapshots docs/preview
          if git diff --quiet -- tests/snapshots docs/preview; then
            exit 0
          fi
          # 画像は XML の差分を出しても読めない (GitHub の Files changed なら描画して比べられる)
          git --no-pager diff -- tests/snapshots
          # main への push: 追従コミットを積む。独立した 2 つの PR がそれぞれ緑のまま
          # マージされて食い違うこと (semantic conflict) もここで吸収される
          if [ "${{ github.event_name }}" = "push" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/snapshots docs/preview
            # [skip ci] は無限ループ避けの保険。描画が非決定になった時に
            # 「push する → CI が走る → また push する」を繰り返さないため
            git commit -q -m "chore: UI スナップショット・画像を更新 [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" ||
              echo "::warning::UI スナップショット・画像の自動更新を push できませんでした"
            exit 0
          fi
          # PR: 落とさず知らせるだけ。差分の中身は次のステップが PR コメントに出す
          {
            echo '### UI snapshot diff'
            echo '```diff'
            git diff -- tests/snapshots
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::UI が変わりました。差分は PR のコメントを参照 (手元で反映するなら 'cargo preview --update-snapshots')"

      # base との UI 差分を PR のコメントに出す。Actions のログを開かなくても、
      # 会話の流れの中で「この変更で画面がどう変わるか」を読めるようにするため。
      # スナップショットが古くて前のステップが落ちた場合こそ見たいので always()
      - name: Comment UI diff
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci-ui-diff-comment.sh
