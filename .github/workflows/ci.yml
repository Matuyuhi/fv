name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # contents: write は main への push で画像を追従コミットするためだけに使う
    # (PR の実行では push しない)。fork からの PR では GITHUB_TOKEN が
    # 権限指定に関わらず読み取り専用になるので、コメントも push も静かに諦める
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      # Action は供給網を増やさないよう公式の checkout / cache のみ。
      # 改竄対策で commit SHA 固定（コメントにバージョン）。Rust はランナー同梱の rustup。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      # Cargo.lock には fv 自身の version 行が含まれ、release（bump）のたびに変わる。
      # それを除いてハッシュし「依存が実際に変わった時だけ」キーが変わるようにする
      # （依存の version 変更は checksum 行に必ず出るので取りこぼさない）。これをしないと
      # bump ごとに別キーで巨大キャッシュが新規保存され、リポジトリのキャッシュ上限を食い潰す。
      - name: Compute version-independent cargo cache key
        id: cargo_key
        shell: bash
        run: |
          key=$(grep -v '^version = "' Cargo.lock | shasum -a 256 | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache cargo & target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ steps.cargo_key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      # preview は dev 専用 feature（既定 off）なので、上の clippy では 1 行も型検査されない。
      # 放置すると気づかないうちにコンパイルできなくなるため、有効化した側も必ず見る。
      - name: Clippy (preview feature)
        run: cargo clippy --all-targets --features preview -- -D warnings

      - name: Build
        run: cargo build --verbose

      # feature を付けて回す。今あるユニットテスト (スナップショットの正規化) が
      # preview 側にあり、既定ビルドでは 1 件も実行されないため
      - name: Test
        run: cargo test --verbose --features preview

      # UI のスクリーンショットテスト。プレビュー (preview/) の全シーンを描き直して、
      # コミット済みの画像 (docs/preview/*.svg) と突き合わせる。画像そのものがスナップショット
      # なので、UI の差分は GitHub が SVG を描画して見せてくれる (Files changed の画像比較)。
      #
      # **差分があっても PR は落とさない**。差分そのものは次のステップが PR コメントとして
      # 出すので、赤い × は「見せる」目的には何も足していない。作者に更新コミットを強いる
      # だけになる。コミット済み画像とのズレは main への push 時に自動追従で解消する
      # (PR で更新し忘れても、マージ後の main は必ず現在の描画と一致する)。
      #
      # 代償として、描画が非決定になった場合に「毎回 main へ追従コミットが積まれる」形で
      # しか気づけなくなる。マスク (SHA・日時) のユニットテストと、履歴に残る chore コミットの
      # 目立ちで足りるという判断
      - name: UI screenshots
        run: |
          cargo run --quiet --features preview -- --preview --update-snapshots
          # 新規シーンのファイルは未追跡のままだと git diff に出ないので intent-to-add しておく
          git add --intent-to-add docs/preview
          if git diff --quiet -- docs/preview; then
            exit 0
          fi
          git --no-pager diff --stat -- docs/preview
          # main への push: 追従コミットを積む。独立した 2 つの PR がそれぞれ緑のまま
          # マージされて食い違うこと (semantic conflict) もここで吸収される
          if [ "${{ github.event_name }}" = "push" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/preview
            # [skip ci] は無限ループ避けの保険。描画が非決定になった時に
            # 「push する → CI が走る → また push する」を繰り返さないため
            git commit -q -m "chore: UI スクリーンショットを更新 [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" ||
              echo "::warning::UI スクリーンショットの自動更新を push できませんでした"
            exit 0
          fi
          # PR: 落とさず知らせるだけ。どのシーンが変わったかは次のステップが PR コメントに出す
          echo "::notice::コミット済みの UI 画像が現在の描画と食い違っています ('cargo preview --update-snapshots' で更新)"

      # base との UI 差分を PR のコメントに出す。Actions のログを開かなくても、
      # 会話の流れの中で「この変更で画面がどう変わるか」を絵で読めるようにするため。
      # 画像がコミットされていない (作者が更新し忘れた) 場合こそ知らせたいので always()
      - name: Comment UI screenshots
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: scripts/ci-ui-screenshot-comment.sh
