name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI は毎回ソースが違うので incremental は効かず、debug の target/ を数百 MB 太らせて
  # キャッシュを圧迫するだけ (scripts/ci-cargo-cache.sh)
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # contents: write は main への push で画像を追従コミットするためだけに使う
    # (PR の実行では push しない)。fork からの PR では GITHUB_TOKEN が
    # 権限指定に関わらず読み取り専用になるので、コメントも push も静かに諦める
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      # Action は供給網を増やさないよう公式の checkout / cache のみ。
      # 改竄対策で commit SHA 固定（コメントにバージョン）。Rust はランナー同梱の rustup。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      # 鍵は「rustc の版 + 依存 (Cargo.lock から fv 自身の version 行を除いたもの)」で、
      # bump では変わらず toolchain の更新と依存の変更でだけ変わる。restore-keys を
      # 付けないのは意図的 (方針の詳細は scripts/ci-cargo-cache.sh)
      - name: Compute cargo cache key
        id: cargo_key
        run: scripts/ci-cargo-cache.sh key >> "$GITHUB_OUTPUT"

      - name: Cache cargo & target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ steps.cargo_key.outputs.rustc }}-${{ steps.cargo_key.outputs.deps }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      # preview は dev 専用 feature（既定 off）なので、上の clippy では 1 行も型検査されない。
      # 放置すると気づかないうちにコンパイルできなくなるため、有効化した側も必ず見る。
      - name: Clippy (preview feature)
        run: cargo clippy --all-targets --features preview -- -D warnings

      - name: Build
        run: cargo build --verbose

      # feature を付けて回す。今あるユニットテスト (スナップショットの正規化) が
      # preview 側にあり、既定ビルドでは 1 件も実行されないため
      - name: Test
        run: cargo test --verbose --features preview

      # UI のスクリーンショットテスト。プレビュー (preview/) の全シーンを描き直して、
      # コミット済みの画像 (docs/preview/*.svg) と突き合わせる。画像そのものがスナップショット
      # なので、UI の差分は GitHub が SVG を描画して見せてくれる (Files changed の画像比較)。
      #
      # **差分があっても PR は落とさない**。差分そのものは次のステップが PR コメントとして
      # 出すので、赤い × は「見せる」目的には何も足していない。作者に更新コミットを強いる
      # だけになる。コミット済み画像とのズレは main への push 時に自動追従で解消する
      # (PR で更新し忘れても、マージ後の main は必ず現在の描画と一致する)。
      #
      # 代償として、描画が非決定になった場合に「毎回 main へ追従コミットが積まれる」形で
      # しか気づけなくなる。マスク (SHA・日時) のユニットテストと、履歴に残る chore コミットの
      # 目立ちで足りるという判断
      - name: UI screenshots
        run: |
          cargo run --quiet --features preview -- --preview --update-snapshots
          # 新規シーンのファイルは未追跡のままだと git diff に出ないので intent-to-add しておく
          git add --intent-to-add docs/preview
          if git diff --quiet -- docs/preview; then
            exit 0
          fi
          git --no-pager diff --stat -- docs/preview
          # main への push: 追従コミットを積む。独立した 2 つの PR がそれぞれ緑のまま
          # マージされて食い違うこと (semantic conflict) もここで吸収される
          if [ "${{ github.event_name }}" = "push" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/preview
            # [skip ci] は無限ループ避けの保険。描画が非決定になった時に
            # 「push する → CI が走る → また push する」を繰り返さないため
            git commit -q -m "chore: UI スクリーンショットを更新 [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" ||
              echo "::warning::UI スクリーンショットの自動更新を push できませんでした"
            exit 0
          fi
          # PR: 落とさず知らせるだけ。どのシーンが変わったかは次のステップが PR コメントに出す
          echo "::notice::コミット済みの UI 画像が現在の描画と食い違っています ('cargo preview --update-snapshots' で更新)"

      # コメントに載せる「変わった画素だけをピンクで塗った 1 枚」を作るツール。
      # ビルド済みのバイナリを取るだけ (release から tar 1 個) で、Action は増やさない。
      # バージョンは固定する — 何が動くかを PR ごとにぶらさないため
      - name: Install shotdiff
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOTDIFF_VERSION: v0.2.0
        run: |
          gh release download "$SHOTDIFF_VERSION" --repo Matuyuhi/shotdiff \
            --pattern shotdiff-x86_64-linux.tar.gz --dir "$RUNNER_TEMP"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/shotdiff-x86_64-linux.tar.gz"
          sudo install -m 755 "$RUNNER_TEMP/shotdiff" /usr/local/bin/shotdiff
          # shotdiff (resvg) は SVG の文字をシステムのフォントで描く。日本語フォントが
          # 無いと合成リポジトリの日本語が豆腐になる (before/after は閲覧者のブラウザが
          # 描くので影響しない。真ん中の diff だけの問題)。入らなくても絵は出るので落とさない
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk ||
            echo "::warning::CJK フォントを入れられませんでした (diff パネルの日本語が豆腐になります)"

      # base との UI 差分を PR のコメントに出す。Actions のログを開かなくても、
      # 会話の流れの中で「この変更で画面がどう変わるか」を絵で読めるようにするため。
      # 画像がコミットされていない (作者が更新し忘れた) 場合こそ知らせたいので always()
      - name: Comment UI screenshots
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: scripts/ci-ui-screenshot-comment.sh

      # actions/cache の保存はジョブの post で走るので、その直前に target/ から「コミットごとに
      # 作り直すもの」(fv 自身の成果物・incremental) を落とす。同じ鍵のキャッシュが
      # コミットのたびに太るのを止め、大きさを依存の総量で頭打ちにする (scripts/ci-cargo-cache.sh)
      - name: Prune target before cache save
        run: scripts/ci-cargo-cache.sh prune
