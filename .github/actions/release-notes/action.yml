name: Release notes
description: 公開済みリリースの body（--generate-notes の What's Changed）の直前に、利用者向けのリリースノートを書き足す。

# 呼び出し側の前提:
#   - push 以外のイベントで動いていること。claude-code-action@v1 は push を
#     "Unsupported event type" で拒否するので、release.yml からは release-notes.yml を
#     workflow_dispatch で起動して、その中で呼ぶ（その run の actor は github-actions[bot]
#     になるので allowed_bots で許可している）。
#   - 対象タグを含む **全履歴** で checkout 済み（fetch-depth: 0）。
#     ローカル action は checkout 後でないと解決できないので、checkout はここには置けない。
#   - 対象リリースが **公開済み**（draft の間はタグが無く git log で範囲を引けない）。
#   - permissions: contents: write（gh release edit）/ pull-requests: read（gh pr list|view）。
# claude-token が空なら何もせずに終わる（token 未設定の環境でリリースを落とさないため）。

inputs:
  tag:
    description: 対象のリリースタグ（例 v1.2.3）
    required: true
  repository:
    description: 対象リポジトリ（owner/name）
    required: true
  github-token:
    description: gh CLI 用のトークン
    required: true
  claude-token:
    description: Claude Code の OAuth トークン。空ならノート生成をスキップする
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Generate release notes
      if: inputs.claude-token != ''
      uses: anthropics/claude-code-action@v1
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-token }}
        github_token: ${{ inputs.github-token }}
        # release.yml の publish が GITHUB_TOKEN で workflow_dispatch するため、actor は
        # github-actions[bot] になり、既定の人間 actor チェックで "non-human actor" として落ちる。
        # workflow_dispatch は write 権限者（か GITHUB_TOKEN）しか起動できず、プロンプトも固定なので
        # '*' ではなくこの bot だけを許可する
        allowed_bots: github-actions[bot]
        claude_args: |
          --model claude-opus-5-5 --effort low
          --allowed-tools "Bash(git log:*),Bash(git tag:*),Bash(git describe:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh release view:*),Bash(gh release list:*),Bash(gh release edit:*),Write,Read"
        prompt: |
          A GitHub release was just published in the `${{ inputs.repository }}` repository.
          The release tag is `${{ inputs.tag }}`.

          Add user-facing release notes to the body of this release.
          The existing body was auto-generated by GitHub (`--generate-notes`) and contains a `## What's Changed` section and a `**Full Changelog**` line. Keep that auto-generated part exactly as it is and insert your notes directly before it.

          Step 1: Identify the previous release tag.
          - Run `gh release list --exclude-drafts --exclude-pre-releases` and take the most recent published release older than `${{ inputs.tag }}`.
          - If there is no previous release, treat all history up to this tag as the range.

          Step 2: Collect the changes.
          - Use the pull requests merged between the previous release tag and `${{ inputs.tag }}`. Find them with `git log <previous_tag>..${{ inputs.tag }} --merges` and `gh pr view` for details.
          - Fall back to commit messages if there are no PRs.

          Step 3: Write the notes.
          - Write from the user's perspective: describe what changed, not how it was implemented.
          - Merge closely related changes into a single bullet.
          - Omit changes with no user-visible impact (CI, refactoring, dependency bumps, version-bump chores, internal logging, bot-generated PRs) unless they fix a bug users could notice.
          - Keep each bullet to one concise line.
          - If no user-visible changes remain, use a single bullet: `- Minor internal improvements`.

          Notes format (follow exactly):

          ■ ${{ inputs.tag }}
          - xxxx
          - xxx

          Step 4: Combine with the existing body.
          - Fetch the current body with `gh release view ${{ inputs.tag }} --json body --jq .body`.
          - Keep everything from the `## What's Changed` heading to the end byte-for-byte. Discard anything before that heading (for example notes written by a previous run of this workflow), so re-running never stacks duplicate notes.
          - If there is no `## What's Changed` heading (e.g. no pull requests were merged), keep the whole auto-generated body (such as the `**Full Changelog**` line), but still discard a leading `■ ${{ inputs.tag }}` block left by a previous run.
          - The new body is: your notes, one blank line, then the kept part. Add nothing else.

          Step 5: Publish.
          - Save the new body to `release-notes.md`.
          - Run `gh release edit ${{ inputs.tag }} --notes-file release-notes.md`.
          - Confirm with `gh release view ${{ inputs.tag }}` that the body starts with your notes and still contains the `## What's Changed` section (when it existed before). If the edit fails, exit with an error instead of reporting success.
